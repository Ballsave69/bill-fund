<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bill Fund">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bill Fund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a pocket ledger; summary card first, then the week's moves, then bills. Bottom tab bar on phones. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #15201d;
  --muted: #5b6a65;
  --line: #dde3e1;
  --accent: #0d6b5e;
  --accent-soft: #e1f0ec;
  --good: #1f7a3d;
  --good-soft: #e3f3e7;
  --warn: #a35a00;
  --warn-soft: #fbefdc;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #17201e; --ink: #e6eeeb; --muted: #97a8a2; --line: #2a3633;
    --accent: #4fc3ad; --accent-soft: #163a34; --good: #6fd08c; --good-soft: #17331f;
    --warn: #f0b058; --warn-soft: #3a2a12; --bad: #f08a80; --bad-soft: #3d1b18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #17201e; --ink: #e6eeeb; --muted: #97a8a2; --line: #2a3633;
  --accent: #4fc3ad; --accent-soft: #163a34; --good: #6fd08c; --good-soft: #17331f;
  --warn: #f0b058; --warn-soft: #3a2a12; --bad: #f08a80; --bad-soft: #3d1b18; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 90px; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 96px; display: grid; gap: 16px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; font-weight: 600; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.hero { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .hero { color: #08201c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { color: #08201c; } }
.hero .label { font-size: 13px; opacity: 0.85; }
.hero .big { font-size: 34px; font-weight: 600; line-height: 1.1; }
.hero .row { display: flex; flex-wrap: wrap; gap: 8px 24px; }
.hero .row > div { display: grid; }
.stack { display: grid; gap: 8px; }
.line { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.line > :first-child { min-width: 0; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.ready { background: var(--good-soft); color: var(--good); }
.chip.track { background: var(--accent-soft); color: var(--accent); }
.chip.behind { background: var(--warn-soft); color: var(--warn); }
.chip.due { background: var(--bad-soft); color: var(--bad); }
.bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bill { display: grid; gap: 6px; padding-block: 12px; border-top: 1px solid var(--line); cursor: pointer; }
.bill:first-of-type { border-top: 0; padding-top: 0; }
.bill:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 14px; font-weight: 600; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 6px 8px; }
button.danger { color: var(--bad); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.5; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
label.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
label.check input { width: auto; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.amount-in { display: flex; gap: 8px; align-items: center; }
.amount-in input { max-width: 140px; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
nav.tabs button { flex: 1; max-width: 186px; border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 14px 8px; }
nav.tabs button[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / 0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; max-height: 92vh; overflow: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 76px; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; }
.empty { text-align: center; padding: 24px 8px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
table.log { width: 100%; border-collapse: collapse; }
table.log td { padding: 10px 4px; border-top: 1px solid var(--line); vertical-align: top; }
table.log td.amt { text-align: right; white-space: nowrap; }
.in { color: var(--good); }
.out { color: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .4s ease; } }
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <h1>Bill Fund</h1>
    <span class="muted small" id="today"></span>
  </header>
  <div id="view"><div class="card empty">Loading your bills…</div></div>
</div>
<nav class="tabs" role="tablist">
  <button role="tab" id="tab-today" aria-selected="true" data-tab="today">Today</button>
  <button role="tab" id="tab-bills" aria-selected="false" data-tab="bills">Bills</button>
  <button role="tab" id="tab-log" aria-selected="false" data-tab="log">Log</button>
</nav>

<script>
(() => {
  const DAY = 86400000;
  const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const FREQ = { monthly: { months: 1, label: "Monthly" }, quarterly: { months: 3, label: "Every 3 months" }, yearly: { months: 12, label: "Yearly" } };
  const KINDS = { bill: "Bills", subscription: "Subscriptions", yearly: "Yearly costs" };

  const state = { db: null, bills: [], ledger: [], settings: { payday: 3, roundTo: 5 }, tab: "today", loaded: { bills: false, ledger: false, settings: false }, readOnly: false };

  // ---------- dates (local, YYYY-MM-DD strings) ----------
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const daysBetween = (a, b) => Math.round((b - a) / DAY);
  const addMonths = (s, n) => {
    const d = parse(s), day = d.getDate();
    const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
    const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    return iso(new Date(t.getFullYear(), t.getMonth(), Math.min(day, last)));
  };
  const nice = s => { const d = parse(s); return `${WEEKDAYS[d.getDay()].slice(0, 3)} ${MONTHS[d.getMonth()]} ${d.getDate()}`; };
  const money = n => "$" + (Math.round(n * 100) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nextPayday = () => { const t = today(); return addDays(t, (state.settings.payday - t.getDay() + 7) % 7); };

  // ---------- money math ----------
  const monthlyEq = b => Number(b.amount || 0) / FREQ[b.freq || "monthly"].months;
  const monthlyTotal = () => state.bills.reduce((s, b) => s + monthlyEq(b), 0);
  const weeklyRaw = () => monthlyTotal() * 12 / 52;
  const weekly = () => { const r = Number(state.settings.roundTo) || 0; const w = weeklyRaw(); return r > 0 ? Math.ceil(w / r) * r : w; };
  const balance = () => state.ledger.reduce((s, e) => s + (e.type === "in" ? 1 : -1) * Number(e.amount || 0), 0);

  function allocate() {
    const t = today();
    let left = Math.max(0, balance());
    return [...state.bills].sort((a, b) => a.nextDue.localeCompare(b.nextDue)).map(b => {
      const amt = Number(b.amount || 0);
      const alloc = Math.min(amt, left); left -= alloc;
      const due = parse(b.nextDue);
      const start = parse(addMonths(b.nextDue, -FREQ[b.freq || "monthly"].months));
      const frac = Math.min(1, Math.max(0, (t - start) / (due - start)));
      const expected = amt * frac;
      let status;
      if (due < t) status = ["due", "Past due date"];
      else if (alloc >= amt - 0.005) status = ["ready", "Ready"];
      else if (alloc >= expected - 1) status = ["track", "On track"];
      else status = ["behind", "Behind"];
      return { bill: b, alloc, pct: amt ? alloc / amt : 0, status, daysLeft: daysBetween(t, due) };
    });
  }

  // ---------- helpers ----------
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(String(c)));
    return n;
  };
  let toastTimer;
  function toast(msg) {
    document.querySelector(".toast")?.remove();
    const t = el("div", { class: "toast", role: "status", text: msg });
    document.body.append(t);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
  }
  async function guard(fn, okMsg) {
    try { await fn(); if (okMsg) toast(okMsg); }
    catch (e) {
      toast("That didn't save on this phone. Make sure you aren't in a private browser tab, then try again.");
    }
  }

  // ---------- views ----------
  function viewToday() {
    const t = today(), pay = nextPayday(), bal = balance(), wk = weekly();
    const rows = allocate();
    const out = [];

    out.push(el("section", { class: "card hero" },
      el("div", { class: "label", text: "In your bill fund" }),
      el("div", { class: "big num", text: money(bal) }),
      el("div", { class: "row" },
        el("div", {}, el("span", { class: "label", text: "Set aside each payday" }), el("span", { class: "num", text: money(wk) })),
        el("div", {}, el("span", { class: "label", text: "Bills per month" }), el("span", { class: "num", text: money(monthlyTotal()) })),
        el("div", {}, el("span", { class: "label", text: "Per day" }), el("span", { class: "num", text: money(monthlyTotal() * 12 / 365) }))
      )
    ));

    if (!state.ledger.length && state.bills.length) {
      const near = rows.filter(r => r.daysLeft <= 31).reduce((s, r) => s + Number(r.bill.amount), 0);
      const start = Math.ceil(Math.max(near, monthlyTotal()));
      const inp = el("input", { id: "start-amt", type: "number", inputmode: "decimal", step: "0.01", min: "0", value: String(start), "aria-label": "Starting amount" });
      out.push(el("section", { class: "card" },
        el("h2", { text: "Get started" }),
        el("div", { text: `Move one month of bills into the fund now so the next due dates are covered from day one. After that, add ${money(wk)} every ${WEEKDAYS[state.settings.payday]}.` }),
        el("div", { class: "amount-in" }, inp,
          el("button", { class: "primary", disabled: state.readOnly, onclick: () => logIn(Number(inp.value), "Starting amount") }, "I moved it"))
      ));
    }

    const amtIn = el("input", { id: "week-amt", type: "number", inputmode: "decimal", step: "0.01", min: "0", value: wk.toFixed(2), "aria-label": "Amount moved into the fund" });
    const isPayday = daysBetween(t, pay) === 0;
    out.push(el("section", { class: "card" },
      el("div", { class: "line" }, el("h2", { text: "Into the fund" }), el("span", { class: "muted small", text: isPayday ? "Today is payday" : `Next payday ${nice(iso(pay))}` })),
      el("div", { text: `Move ${money(wk)} from checking into your bill fund account.` }),
      el("div", { class: "amount-in" }, amtIn,
        el("button", { class: "primary", disabled: state.readOnly, onclick: () => logIn(Number(amtIn.value), "Payday set-aside") }, "I moved it"))
    ));

    const horizon = addDays(t, 7);
    const dueSoon = rows.filter(r => parse(r.bill.nextDue) <= horizon);
    const backTotal = dueSoon.reduce((s, r) => s + Number(r.bill.amount), 0);
    out.push(el("section", { class: "card" },
      el("div", { class: "line" }, el("h2", { text: "Back to checking" }), el("span", { class: "muted small", text: "Due in the next 7 days" })),
      dueSoon.length
        ? [
            el("div", { class: "stack" }, dueSoon.map(r => el("div", { class: "line" },
              el("div", {}, el("div", { class: "name", text: r.bill.name }), el("div", { class: "muted small", text: `${nice(r.bill.nextDue)}${r.bill.autopay ? " · autopay" : " · pay it yourself"}` })),
              el("span", { class: "num", text: money(Number(r.bill.amount)) })))),
            el("div", { class: "line" }, el("strong", { text: "Total to move back" }), el("strong", { class: "num", text: money(backTotal) })),
            el("div", { class: "note", text: "Move this from the fund to checking a couple of days before the earliest due date, so autopay finds the money there." }),
            el("div", { class: "actions" }, el("button", { class: "primary", disabled: state.readOnly, onclick: () => moveBack(dueSoon.map(r => r.bill), backTotal) }, `I moved ${money(backTotal)} back`))
          ]
        : el("div", { class: "muted", text: "Nothing due this week." })
    ));

    const upcoming = rows.filter(r => parse(r.bill.nextDue) > horizon).slice(0, 6);
    if (upcoming.length) {
      out.push(el("section", { class: "card" }, el("h2", { text: "Coming up" }), el("div", {}, upcoming.map(billRow))));
    }
    return out;
  }

  function billRow(r) {
    const b = r.bill;
    const open = () => editBill(b);
    return el("div", { class: "bill", tabindex: "0", role: "button", "aria-label": `Edit ${b.name}`, onclick: open, onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } } },
      el("div", { class: "line" },
        el("div", {}, el("div", { class: "name", text: b.name }), el("div", { class: "muted small", text: `${FREQ[b.freq].label} · next ${nice(b.nextDue)}${b.variable ? " · estimate" : ""}` })),
        el("div", { style: "text-align:right" }, el("div", { class: "num", text: money(Number(b.amount)) }), el("span", { class: "chip " + r.status[0], text: r.status[1] }))
      ),
      el("div", { class: "bar", "aria-hidden": "true" }, el("i", { style: `width:${Math.round(r.pct * 100)}%` })),
      el("div", { class: "muted small num", text: `${money(r.alloc)} of ${money(Number(b.amount))} set aside` })
    );
  }

  function viewBills() {
    const rows = allocate();
    const out = [];
    for (const kind of Object.keys(KINDS)) {
      const list = rows.filter(r => (r.bill.kind || "bill") === kind);
      if (!list.length) continue;
      const total = list.reduce((s, r) => s + monthlyEq(r.bill), 0);
      out.push(el("section", { class: "card" },
        el("div", { class: "line" }, el("h2", { text: KINDS[kind] }), el("span", { class: "muted small num", text: `${money(total)}/mo` })),
        el("div", {}, list.map(billRow))));
    }
    if (!state.bills.length) out.push(el("section", { class: "card empty" }, "No bills yet. Add your first one below."));
    out.push(el("div", { class: "actions" }, el("button", { class: "primary", disabled: state.readOnly, onclick: () => editBill(null) }, "Add a bill")));

    const paySel = el("select", { id: "set-payday" }, WEEKDAYS.map((d, i) => el("option", { value: String(i), selected: i === Number(state.settings.payday) }, d)));
    const roundSel = el("select", { id: "set-round" }, [["0", "Exact amount"], ["1", "Nearest $1"], ["5", "Nearest $5"], ["10", "Nearest $10"]].map(([v, l]) => el("option", { value: v, selected: Number(v) === Number(state.settings.roundTo) }, l)));
    out.push(el("section", { class: "card" },
      el("h2", { text: "Settings" }),
      el("div", { class: "grid2" },
        el("label", { class: "f", for: "set-payday" }, "Payday", paySel),
        el("label", { class: "f", for: "set-round" }, "Round set-aside up to", roundSel)),
      el("div", { class: "actions" }, el("button", { disabled: state.readOnly, onclick: () => saveSettings({ payday: Number(paySel.value), roundTo: Number(roundSel.value) }) }, "Save settings")),
      el("div", { class: "note", text: "Bills marked "estimate" change month to month, so budget a little above the usual amount." })
    ));
    out.push(el("section", { class: "card" },
      el("h2", { text: "Backup" }),
      el("div", { class: "note", text: "Your bills and moves are saved only on this phone. Save a backup now and then so you can restore them on a new phone or after clearing your browser." }),
      el("div", { class: "actions" }, el("button", { onclick: exportData }, "Save a backup"), el("button", { onclick: pickFile }, "Restore from a file"))));
    return out;
  }

  function viewLog() {
    const list = [...state.ledger].sort((a, b) => (b.date + (b.at || "")).localeCompare(a.date + (a.at || "")));
    const totalIn = state.ledger.filter(e => e.type === "in").reduce((s, e) => s + Number(e.amount), 0);
    const totalOut = state.ledger.filter(e => e.type === "out").reduce((s, e) => s + Number(e.amount), 0);
    return [
      el("section", { class: "card" },
        el("div", { class: "line" }, el("span", { text: "Moved in" }), el("span", { class: "num in", text: money(totalIn) })),
        el("div", { class: "line" }, el("span", { text: "Moved back for bills" }), el("span", { class: "num", text: money(totalOut) })),
        el("div", { class: "line" }, el("strong", { text: "In the fund" }), el("strong", { class: "num", text: money(totalIn - totalOut) }))),
      el("section", { class: "card" },
        el("h2", { text: "Every move" }),
        list.length
          ? el("div", { style: "overflow-x:auto" }, el("table", { class: "log" }, el("tbody", {}, list.map(e => el("tr", {},
              el("td", {}, el("div", { class: "name", text: e.note || (e.type === "in" ? "Moved in" : "Moved back") }), el("div", { class: "muted small", text: nice(e.date) })),
              el("td", { class: "amt" }, el("div", { class: "num " + e.type, text: (e.type === "in" ? "+" : "−") + money(Number(e.amount)) }),
                el("button", { class: "ghost small", disabled: state.readOnly, onclick: () => removeEntry(e) }, "Remove")))))))
          : el("div", { class: "empty", text: "No moves yet. They'll show here when you tap \"I moved it\"." }))
    ];
  }

  function render() {
    const t = today();
    document.getElementById("today").textContent = `${WEEKDAYS[t.getDay()]}, ${MONTHS[t.getMonth()]} ${t.getDate()}`;
    for (const b of document.querySelectorAll("nav.tabs button")) b.setAttribute("aria-selected", String(b.dataset.tab === state.tab));
    const view = document.getElementById("view");
    view.replaceChildren();
    if (!state.bills.length && !state.ledger.length) { view.append(viewSetup()); return; }
    const parts = state.tab === "bills" ? viewBills() : state.tab === "log" ? viewLog() : viewToday();
    view.append(el("div", { class: "stack", style: "gap:16px" }, parts));
  }

  // ---------- writes ----------
  async function logIn(amount, note) {
    if (!(amount > 0)) { toast("Enter an amount above $0."); return; }
    await guard(() => state.db.collection("ledger").add({ type: "in", amount: Math.round(amount * 100) / 100, date: iso(today()), at: new Date().toISOString(), note }), `Added ${money(amount)} to the fund`);
  }
  async function moveBack(bills, total) {
    await guard(async () => {
      await state.db.collection("ledger").add({ type: "out", amount: Math.round(total * 100) / 100, date: iso(today()), at: new Date().toISOString(), note: "Back to checking: " + bills.map(b => b.name).join(", "), billIds: bills.map(b => b.id) });
      for (const b of bills) await state.db.doc("bills/" + b.id).update({ nextDue: addMonths(b.nextDue, FREQ[b.freq].months), lastPaid: b.nextDue });
    }, `Moved ${money(total)} back. Next due dates updated.`);
  }
  async function removeEntry(e) {
    await guard(() => state.db.doc("ledger/" + e.id).delete(), "Removed from the log");
  }
  async function saveSettings(s) {
    await guard(() => state.db.doc("settings/main").set({ ...state.settings, ...s }), "Settings saved");
  }

  function editBill(b) {
    const isNew = !b;
    b = b || { name: "", amount: "", freq: "monthly", nextDue: iso(addDays(today(), 30)), autopay: true, kind: "bill", variable: false };
    const f = {
      name: el("input", { id: "b-name", value: b.name, required: true, autocomplete: "off" }),
      amount: el("input", { id: "b-amount", type: "number", inputmode: "decimal", step: "0.01", min: "0", value: String(b.amount) }),
      freq: el("select", { id: "b-freq" }, Object.entries(FREQ).map(([k, v]) => el("option", { value: k, selected: k === b.freq }, v.label))),
      nextDue: el("input", { id: "b-due", type: "date", value: b.nextDue }),
      kind: el("select", { id: "b-kind" }, Object.entries(KINDS).map(([k, v]) => el("option", { value: k, selected: k === (b.kind || "bill") }, v))),
      autopay: el("input", { id: "b-autopay", type: "checkbox", checked: !!b.autopay }),
      variable: el("input", { id: "b-variable", type: "checkbox", checked: !!b.variable })
    };
    const close = () => bg.remove();
    const confirmRow = el("div", { class: "actions", hidden: true },
      el("span", { class: "small", text: "Delete this bill?" }),
      el("button", { class: "danger", onclick: async () => { close(); await guard(() => state.db.doc("bills/" + b.id).delete(), `Deleted ${b.name}`); } }, "Delete"),
      el("button", { onclick: () => { confirmRow.hidden = true; } }, "Keep"));
    const form = el("form", { class: "sheet", "aria-label": isNew ? "Add a bill" : `Edit ${b.name}`, onsubmit: async e => {
      e.preventDefault();
      const amt = Number(f.amount.value);
      if (!f.name.value.trim() || !(amt > 0) || !f.nextDue.value) { toast("Add a name, an amount above $0 and a due date."); return; }
      const data = { name: f.name.value.trim(), amount: Math.round(amt * 100) / 100, freq: f.freq.value, nextDue: f.nextDue.value, kind: f.kind.value, autopay: f.autopay.checked, variable: f.variable.checked };
      close();
      await guard(() => isNew ? state.db.collection("bills").add(data) : state.db.doc("bills/" + b.id).set({ ...data, lastPaid: b.lastPaid || null }), isNew ? `Added ${data.name}` : `Saved ${data.name}`);
    } },
      el("div", { class: "line" }, el("h2", { text: isNew ? "Add a bill" : "Edit bill" }), el("button", { type: "button", class: "ghost", onclick: close }, "Close")),
      el("label", { class: "f", for: "b-name" }, "Name", f.name),
      el("div", { class: "grid2" }, el("label", { class: "f", for: "b-amount" }, "Amount ($)", f.amount), el("label", { class: "f", for: "b-freq" }, "How often", f.freq)),
      el("div", { class: "grid2" }, el("label", { class: "f", for: "b-due" }, "Next due date", f.nextDue), el("label", { class: "f", for: "b-kind" }, "Group", f.kind)),
      el("label", { class: "check", for: "b-autopay" }, f.autopay, "Autopay pays it from checking"),
      el("label", { class: "check", for: "b-variable" }, f.variable, "Amount changes month to month (estimate)"),
      el("div", { class: "actions" },
        el("button", { type: "submit", class: "primary", disabled: state.readOnly }, isNew ? "Add bill" : "Save"),
        isNew ? null : el("button", { type: "button", class: "danger", disabled: state.readOnly, onclick: () => { confirmRow.hidden = false; } }, "Delete")),
      confirmRow
    );
    const bg = el("div", { class: "sheet-bg", onclick: e => { if (e.target === bg) close(); } }, form);
    document.body.append(bg);
    f.name.focus();
  }

  // ---------- on-phone storage ----------
  // Everything lives in this phone's browser storage under one key. Same small API the screens use:
  // collection(name).add(data), doc("name/id").set/update/delete.
  const KEY = "billfund-data-v1";
  const store = { bills: {}, ledger: {}, settings: {} };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  function syncState() {
    state.bills = Object.entries(store.bills).map(([id, d]) => ({ id, ...d })).filter(b => b.nextDue && FREQ[b.freq]);
    state.ledger = Object.entries(store.ledger).map(([id, d]) => ({ id, ...d }));
    state.settings = { payday: 3, roundTo: 5, ...(store.settings.main || {}) };
  }
  function persist() {
    localStorage.setItem(KEY, JSON.stringify({ version: 1, savedAt: new Date().toISOString(), ...store }));
    syncState(); render();
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const d = JSON.parse(raw); for (const k of ["bills", "ledger", "settings"]) store[k] = d[k] || {}; }
    } catch (e) { toast("Couldn't read saved data on this phone."); }
    syncState();
  }
  state.db = {
    collection: name => ({ add: async data => { const id = newId(); store[name][id] = data; persist(); return { id }; } }),
    doc: path => {
      const [name, id] = path.split("/");
      return {
        set: async data => { store[name][id] = data; persist(); },
        update: async data => { if (!store[name][id]) throw { code: "not_found" }; store[name][id] = { ...store[name][id], ...data }; persist(); },
        delete: async () => { delete store[name][id]; persist(); }
      };
    }
  };

  // ---------- backup and import ----------
  function importData(text) {
    let d;
    try { d = JSON.parse(text); } catch (e) { toast("That isn't a Bill Fund file. Check you picked the right one."); return; }
    if (!d || typeof d !== "object" || !d.bills || typeof d.bills !== "object") { toast("That file has no bills in it."); return; }
    const bills = {};
    for (const [id, b] of Object.entries(d.bills)) {
      if (!b || typeof b.name !== "string" || !(Number(b.amount) > 0) || !FREQ[b.freq] || !/^\d{4}-\d{2}-\d{2}$/.test(b.nextDue || "")) continue;
      bills[String(id).slice(0, 60)] = { name: b.name.slice(0, 80), amount: Math.round(Number(b.amount) * 100) / 100, freq: b.freq, nextDue: b.nextDue, kind: KINDS[b.kind] ? b.kind : "bill", autopay: !!b.autopay, variable: !!b.variable, lastPaid: b.lastPaid || null };
    }
    const ledger = {};
    for (const [id, e] of Object.entries(d.ledger || {})) {
      if (!e || (e.type !== "in" && e.type !== "out") || !(Number(e.amount) > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(e.date || "")) continue;
      ledger[String(id).slice(0, 60)] = { type: e.type, amount: Math.round(Number(e.amount) * 100) / 100, date: e.date, at: String(e.at || ""), note: String(e.note || "").slice(0, 300), billIds: Array.isArray(e.billIds) ? e.billIds.map(String) : undefined };
    }
    const main = d.settings && d.settings.main ? d.settings.main : {};
    store.bills = bills; store.ledger = ledger;
    store.settings = { main: { payday: Number.isInteger(main.payday) && main.payday >= 0 && main.payday < 7 ? main.payday : 3, roundTo: [0, 1, 5, 10].includes(Number(main.roundTo)) ? Number(main.roundTo) : 5 } };
    try { persist(); toast(`Loaded ${Object.keys(bills).length} bills`); } catch (e) { toast("Couldn't save on this phone. Check you aren't in a private browser tab."); }
  }
  function pickFile() {
    const inp = el("input", { type: "file", accept: ".json,application/json,text/plain", hidden: true });
    inp.addEventListener("change", () => { const f = inp.files && inp.files[0]; if (!f) return; f.text().then(importData); inp.remove(); });
    document.body.append(inp); inp.click();
  }
  async function exportData() {
    const text = JSON.stringify({ version: 1, savedAt: new Date().toISOString(), ...store }, null, 2);
    const name = `bill-fund-backup-${iso(today())}.json`;
    const file = new File([text], name, { type: "application/json" });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Bill Fund backup" }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
    const a = el("a", { href: URL.createObjectURL(file), download: name });
    document.body.append(a); a.click(); a.remove();
  }
  function importCard(title, intro) {
    const ta = el("textarea", { id: "paste-data", placeholder: "Or paste the file's text here", "aria-label": "Paste Bill Fund data" });
    return el("section", { class: "card" },
      el("h2", { text: title }),
      el("div", { text: intro }),
      el("div", { class: "actions" }, el("button", { class: "primary", onclick: pickFile }, "Choose file")),
      ta,
      el("div", { class: "actions" }, el("button", { onclick: () => { if (ta.value.trim()) importData(ta.value); } }, "Load pasted text")));
  }
  function viewSetup() {
    return el("div", { class: "stack", style: "gap:16px" },
      importCard("Load your bills", "Pick the bills file (bill-fund-bills.json) you saved to this phone. Everything stays on this phone."),
      el("div", { class: "actions" }, el("button", { onclick: () => { state.tab = "bills"; editBill(null); } }, "Or add bills by hand")));
  }

  // ---------- boot ----------
  for (const b of document.querySelectorAll("nav.tabs button")) b.addEventListener("click", () => {
    state.tab = b.dataset.tab;
    try { localStorage.setItem("billfund-tab", state.tab); } catch (e) {}
    render(); window.scrollTo(0, 0);
  });
  try { const t = localStorage.getItem("billfund-tab"); if (t) state.tab = t; } catch (e) {}
  load();
  render();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
</html>
